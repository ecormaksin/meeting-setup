plugins {
    id 'org.springframework.boot' version '2.5.6'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'org.dddjava.jig-gradle-plugin' version '2021.9.1'
    id 'java'
    id 'idea'
}

group = 'org.meeting'
version = '0.0.1-SNAPSHOT'
description 'ミーティング調整サービスの試作'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.0'
    implementation 'com.github.ua-parser:uap-java:1.5.2'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.github.irof:jig-erd:latest.release'
}

test {
    useJUnitPlatform()
}

// Mybatisのmapper.xmlのスキャン対象
sourceSets {
    main {
        resources.srcDirs = ["src/main/java", "src/main/resources"]
    }
}

[compileJava, processResources]*.shouldRunAfter(clean)

// JIG ドキュメントの生成タスク

jigReports.dependsOn(clean, classes)

task document(type: Copy, dependsOn: jigReports) {
    from 'build/jig'
    into 'src/main/resources/static/document/jig'
}

task documentWithErd(type: Test, dependsOn: document) {
    useJUnitPlatform()
    include '**/EntityRelationshipDiagram**'
}

[document, documentWithErd]*.group('jig')
