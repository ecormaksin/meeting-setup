plugins {
    id 'org.springframework.boot' version '2.7.0'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'org.dddjava.jig-gradle-plugin' version '2022.4.4'
    id 'java'
    id 'idea'
}

group = 'org.meeting'
version = '0.0.1-SNAPSHOT'
description 'ミーティング調整サービスの試作'
sourceCompatibility = '17'

sourceSets {
    main {
        resources.srcDirs = ["src/main/java", "src/main/resources"]
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
    implementation 'de.huxhorn.sulky:de.huxhorn.sulky.ulid:8.3.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.github.irof:jig-erd:latest.release'

    testImplementation 'org.testcontainers:postgresql:1.17.2'
}

test {
    useJUnitPlatform()
}

jig {
    linkPrefix = "https://github.com/ecormaksin/meeting-setup/tree/main/src/main/java"
}

[compileJava, processResources]*.shouldRunAfter(clean)
jigReports.dependsOn(clean, classes)

bootRun {
    sourceResources sourceSets.main
}

//tasks.withType(JavaCompile) {
//    options.compilerArgs << '-Xlint:deprecation'
//}

jar {
    manifest{
        attributes(
                'Main-Class': 'meeting.Application'
        )
    }
}
