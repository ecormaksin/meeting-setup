plugins {
    id 'org.springframework.boot' version '2.5.6'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'org.dddjava.jig-gradle-plugin' version '2021.9.2'
    id 'java'
    id 'idea'
}

group = 'org.meeting'
version = '0.0.1-SNAPSHOT'
description 'ミーティング調整サービスの試作'
sourceCompatibility = '17'

sourceSets {
    main {
        resources.srcDirs = ["src/main/java", "src/main/resources"]
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.0'
    implementation 'com.github.ua-parser:uap-java:1.5.2'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.github.irof:jig-erd:latest.release'

    testRuntimeOnly 'com.h2database:h2'
}

test {
    useJUnitPlatform()
}

jig {
    linkPrefix = "https://github.com/ecormaksin/meeting-setup/tree/main/src/main/java"
}

[compileJava, processResources]*.shouldRunAfter(clean)
jigReports.dependsOn(clean, classes)

bootRun {
    sourceResources sourceSets.main
}

//tasks.withType(JavaCompile) {
//    options.compilerArgs << '-Xlint:deprecation'
//}

task copySchemaFileToResource(type: Copy){
    from 'docker/postgres/docker-entrypoint-initdb.d/schema.sql'
    into 'src/main/resources'
}
processResources.dependsOn(copySchemaFileToResource)

// スキーマ ファイルをテスト リソースへコピーするタスク
task copySchemaFileToTestResource(type: Copy) {
    from 'docker/postgres/docker-entrypoint-initdb.d/schema.sql'
    into 'src/test/resources'
}
processTestResources.dependsOn(copySchemaFileToTestResource)

jar {
    manifest{
        attributes(
                'Main-Class': 'meeting.Application'
        )
    }
}
