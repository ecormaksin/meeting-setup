plugins {
    id 'org.springframework.boot' version '2.7.0'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'org.dddjava.jig-gradle-plugin' version '2022.4.4'
    id 'java'
    id 'idea'
}

group = 'org.meeting'
version = '0.0.1-SNAPSHOT'
description 'ミーティング調整サービスの試作'
sourceCompatibility = '17'

sourceSets {
    main {
        resources.srcDirs = ["src/main/java", "src/main/resources"]
    }
    test {
        // テストコードのソースコードと同じディレクトリのテストデータをリソースとして参照可能にする
        resources.srcDirs = ["src/test/java", "src/test/resources"]
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation (
        'org.springframework.boot:spring-boot-starter-web',
        'org.springframework.boot:spring-boot-starter-validation',
        'org.springframework.boot:spring-boot-starter-thymeleaf',
        'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2',
        'de.huxhorn.sulky:de.huxhorn.sulky.ulid:8.3.0',
        'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
    )

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation (
        'org.springframework.boot:spring-boot-starter-test',
        'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:2.2.2',
        'com.github.irof:jig-erd:0.0.12',
        'nl.jqno.equalsverifier:equalsverifier:3.10.1',
        'net.sourceforge.htmlunit:htmlunit',
        'org.seleniumhq.selenium:htmlunit-driver',
        'org.seleniumhq.selenium:selenium-support',
        'org.mockito:mockito-inline:4.6.1',
        'org.jmockit:jmockit:1.49',
        'org.testcontainers:junit-jupiter:1.17.3',
        'org.testcontainers:postgresql:1.17.3',
        'org.dbunit:dbunit:2.7.3',
        'com.github.springtestdbunit:spring-test-dbunit:1.3.0',
        'org.apache.poi:poi:5.2.2',
        'org.apache.poi:poi-ooxml:5.2.2'
    )
}

test {
    jvmArgs = ["-javaagent:testlibs/jmockit-1.49.jar"]

    useJUnitPlatform()

    // https://stackoverflow.com/questions/66586272/running-a-single-junit5-test-on-gradle-exits-with-standard-error
    // https://github.com/junit-team/junit5/issues/1774
    systemProperty 'java.util.logging.config.file', "src/test/resources/logging-test.properties"

    forkEvery = 1

    testLogging {
        showStandardStreams = true
    }
}

jig {
    linkPrefix = "https://github.com/ecormaksin/meeting-setup/tree/main/src/main/java"
}

[compileJava, processResources]*.shouldRunAfter(clean)
jigReports.dependsOn(clean, classes)

bootRun {
    sourceResources sourceSets.main
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-Xlint:unchecked'
//    options.compilerArgs << '-Xlint:deprecation'
}
