<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <th:block th:replace="_parts/head :: meta"/>
    <title>出欠の編集</title>
    <th:block th:replace="_parts/head :: css"/>
</head>
<body>
<header th:replace="_parts/navigation :: meeting-show_only (meetingNumber=${meetingNumber})"></header>

<main>
    <article>
        <h1>出欠の編集</h1>
        <form method="post" action="#"
              th:object="${attendanceInputForm}"
              th:action="@{/meeting/__${meetingNumber}__/attendance/__${attendanceNumber}__/edit}">

            <ul th:if="${#fields.hasGlobalErrors()}" class="notification is-danger">
                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
            </ul>

            <th:block
                    th:replace="_parts/attendance :: form (participantName=*{participantName}, schedules=*{schedules}, conveniences=*{conveniences}, attendanceComment=*{attendanceComment})"></th:block>

            <p>
                削除すると元に戻せません。
            </p>
            <div class="attendance-edit__button-parent">
                <div>
                    <button id="editAttendanceButton" disabled="disabled">編集</button>
                </div>
                <div>
                    <button type="button" id="deleteAttendanceButton" class="delete-button" disabled="disabled">削除
                    </button>
                    <button name="delete" id="submitFormButtonWithDelete" class="button-hidden">隠し削除実行ボタン</button>
                </div>
            </div>
        </form>
    </article>
</main>
<footer th:replace="_parts/footer :: default"></footer>
<script th:inline="javascript">
$(function() {
  function disableTransactionButtons(disabled) {
    $('#editAttendanceButton').prop('disabled', disabled);
    $('#deleteAttendanceButton').prop('disabled', disabled);
  }

  function setParticipantNumber() {
    document.cookie = "participantNumber=" + localStorage.getItem('participantNumber');
  }

  function prepareSubmit() {
    disableTransactionButtons(true);
    setParticipantNumber();
  }

  disableTransactionButtons(false);

  $('#editAttendanceButton').on('click', function() {
    prepareSubmit();
    $('form').get(0).submit();
  });

  $('#deleteAttendanceButton').on('click', function() {
    prepareSubmit();
    $('#submitFormButtonWithDelete').click();
  });
});

</script>
</body>
</html>
