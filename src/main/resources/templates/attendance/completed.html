<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <th:block th:if="${attendanceLifeCycleStatus == T(meeting.domain.model.attendance.AttendanceLifeCycleStatus).CREATION}">
    <title>出欠の入力 完了</title>
  </th:block>
  <th:block th:if="${attendanceLifeCycleStatus == T(meeting.domain.model.attendance.AttendanceLifeCycleStatus).EDITION}">
    <title>出欠の編集 完了</title>
  </th:block>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>
<header th:replace="_parts/navigation :: meeting-show_only (meetingId=${meetingId})"></header>

<main>
  <article>
    <p>出欠の<span th:text="${attendanceLifeCycleStatus.text()}"></span>が完了しました。</p>
    <p>出欠を編集するには、ミーティングの詳細へ移動するか、次のURLへアクセスしてください。: </p>
    <div class="attendance-edit__location-parent">
      <input type="text" id="url" class="attendance-edit__location" th:readonly="readonly" th:value="${attendanceEditLocation}">
      <button id="copyUrlButton" class="small-button url-copy-button">URLをコピーする</button>
    </div>
  </article>
</main>
<footer th:replace="_parts/footer :: default"></footer>
<script>
$(function() {
  var copyUrlButtonObj = $('#copyUrlButton');

  function copyUrl() {
    var url = $('#url').val();
    var dummyTextBox = $("<input type='text'>");
    dummyTextBox.val(url);
    $('body').append(dummyTextBox);
    dummyTextBox.select();
    document.execCommand('copy');
    dummyTextBox.remove();

    copyUrlButtonObj.text('コピー完了');
    copyUrlButtonObj.addClass('url-copy-button-copied');
    setTimeout(removeCopiedStyle, 5000);
  }

  function removeCopiedStyle() {
    copyUrlButtonObj.text('URLをコピーする');
    copyUrlButtonObj.removeClass('url-copy-button-copied');
  }

  copyUrlButtonObj.on('click', copyUrl);
});
</script>
</body>
</html>
