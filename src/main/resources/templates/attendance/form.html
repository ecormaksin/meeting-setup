<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>出欠の入力</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>

<main>
  <article>
    <h1>出欠の入力</h1>
    <form method="post" action="#"
          th:object="${attendanceInputRequest}" th:action="@{/meeting/__${meetingId}__/attendance/input}">

      <ul th:if="${#fields.hasGlobalErrors()}" class="notification is-danger">
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>

      <label>参加者名</label>
      <input type="text" th:field="*{participantName.value}" class="participant-name">
      <p th:if="${#fields.hasErrors('participantName.value')}">
        <mark><span th:errors="*{participantName.value}"></span></mark>
      </p>

      <label>日程候補</label>
      <table>
        <thead>
        <tr>
          <th></th>
          <th>日程</th>
          <th>都合</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="schedule,scheduleStat: ${schedules.asList()}">
          <td th:text="${scheduleStat.count}">1</td>
          <td th:text="${schedule.meetingDate().show() + ' ' + schedule.startTime().show() + ' ～ ' + schedule.endTime().show()}">
          </td>
          <td>
            <th:block th:each="convenienceCategory : ${T(meeting.domain.model.attendance.convenience.ConvenienceCategory).values()}">
              <input type="radio" th:field="${attendanceInputRequest.conveniences.of(schedule.scheduleNumber())}"
                     th:value="${convenienceCategory.symbol()}"
                     th:text="${convenienceCategory.symbol()}" />
            </th:block>
          </td>
        </tr>
        </tbody>
      </table>

      <label>コメント</label>
      <textarea th:field="*{attendanceComment.value}" class="attendance-comment"></textarea>
      <p th:if="${#fields.hasErrors('attendanceComment.value')}">
        <mark><span th:errors="*{attendanceComment.value}"></span></mark>
      </p>

    </form>
  </article>

</main>
<footer th:replace="_parts/footer :: default"></footer>
</body>
</html>
