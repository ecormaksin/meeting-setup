<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>出欠の入力</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>

<main>
  <article>
    <h1>出欠の入力</h1>
    <form method="post" action="#"
          th:object="${attendanceInputRequest}" th:action="@{/meeting/__${meetingId}__/attendance/input}">

      <ul th:if="${#fields.hasGlobalErrors()}" class="notification is-danger">
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>

      <div th:replace="_parts/attendance_input :: participantName_part (participantName=*{participantName})"></div>

      <div th:replace="_parts/attendance_input :: conveniences_part (schedules=*{schedules}, conveniences=*{conveniences})"></div>

      <div th:replace="_parts/attendance_input :: comment_part (attendanceComment=*{attendanceComment})"></div>

      <div>
        <button>入力</button>
      </div>
    </form>
  </article>

</main>
<footer th:replace="_parts/footer :: default"></footer>
</body>
</html>
