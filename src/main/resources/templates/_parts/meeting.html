<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="form (meetingNumber, subject, memo, organizerNumber, scheduleInputs)">

        <input type="hidden" th:field="*{meetingNumber.value}">

        <label>件名</label>
        <input type="text" th:field="*{subject.value}" placeholder="○○様カンファレンス など" class="meeting__subject">
        <p th:if="${#fields.hasErrors('subject.value')}">
            <mark><span th:errors="*{subject.value}"></span></mark>
        </p>

        <label>メモ（任意）</label>
        <textarea th:field="*{memo.value}" placeholder="リハビリ実施計画書について など" class="meeting__memo"></textarea>
        <p th:if="${#fields.hasErrors('memo.value')}">
            <mark><span th:errors="*{memo.value}"></span></mark>
        </p>

        <input type="hidden" th:field="*{organizerNumber.value}">

        <div class="meeting__scheduleInputs-title-section">
            <label class="meeting__scheduleInputs-title-label">日程候補</label>
            <button name="addSchedule" class="small-button">追加</button>
        </div>
        <table>
            <thead>
            <tr>
                <th></th>
                <th>開催日</th>
                <th colspan="2">開始時刻</th>
                <th>会議時間</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="schedule,scheduleStat: *{scheduleInputs.asList()}">
                <tr>
                    <td th:text="${scheduleStat.count}">1</td>
                    <td>
                        <input type="hidden" th:field="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleNumber.value}">
                        <input type="date" th:field="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.meetingDate.value}">
                        <p th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.meetingDate.value')}">
                            <mark><span th:errors="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.meetingDate.value}"></span></mark>
                        </p>
                    </td>
                    <td>
                        <input type="time" th:field="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startHour.value}">
                        <p th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startHour.value')}">
                            <mark><span th:errors="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startHour.value}"></span></mark>
                        </p>
                    </td>
                    <td>～</td>
                    <td>
                        <input type="time" th:field="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startMinute.value}">
                        <p th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startMinute.value')}">
                            <mark><span th:errors="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startMinute.value}"></span></mark>
                        </p>
                    </td>
                    <td>
                        <button th:if="${scheduleStat.index > 0}"
                                name="removeSchedule"
                                th:value="${scheduleStat.index}"
                                class="small-button">削除</button>
                    </td>
                </tr>
                <tr th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__]') or #fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct')}">
                    <td colspan="6" class="meeting__scheduleInputs-error">
                        <p th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct')}">
                            <mark><span th:errors="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct}"></span></mark>
                        </p>
                        <p th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__]')}">
                            <mark><span th:errors="*{scheduleInputs.list[__${scheduleStat.index}__]}"></span></mark>
                        </p>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
        <div>
            <p th:if="${#fields.hasErrors('scheduleInputs')}">
                <mark><span th:errors="*{scheduleInputs}"></span></mark>
            </p>
        </div>

    </th:block>

    <th:block th:fragment="show-location (meetingShowLocation)">
        <div class="meeting-show__location-parent">
            <input type="text" id="url" class="meeting-show__location" th:readonly="readonly" th:value="${meetingShowLocation}">
            <button id="copyUrlButton" class="small-button url-copy-button">URLをコピーする</button>
        </div>
        <p>ミーティングの編集・削除を行う場合は、上記URLへアクセスするか、「ミーティングの詳細」をクリックしてください。</p>
    </th:block>
</body>
</html>
