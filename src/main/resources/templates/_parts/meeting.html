<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="form (meetingInputForm)">

        <label>件名</label>
        <input type="text" th:field="*{subject.value}" placeholder="○○様カンファレンス など" class="meeting__subject">
        <p th:if="${#fields.hasErrors('subject.valid')}">
            <mark><span id="subjectError" th:errors="*{subject.valid}"></span></mark>
        </p>

        <label>メモ（任意）</label>
        <textarea th:field="*{memo.value}" placeholder="リハビリ実施計画書について など" class="meeting__memo"></textarea>
        <p th:if="${#fields.hasErrors('memo.value')}">
            <mark><span id="memoError" th:errors="*{memo.value}"></span></mark>
        </p>

        <div class="meeting__scheduleInputs-title-section">
            <label class="meeting__scheduleInputs-title-label">日程候補</label>
            <button id="addSchedule" name="addSchedule" class="small-button"
                th:disabled="${meetingInputForm.scheduleAppendable() == T(meeting.presentation.meeting.input.schedule.ScheduleInputAppendable).NO}">追加</button>
        </div>
        <p th:if="${#fields.hasErrors('scheduleInputs')}">
            <mark>
                <span name="scheduleInputsError" th:errors="*{scheduleInputs}"></span>
            </mark>
        </p>
        <p th:if="${#fields.hasErrors('scheduleInputs.sizeWithinSpecifiedRange')}">
            <mark>
                <span name="scheduleInputsError" th:errors="*{scheduleInputs.sizeWithinSpecifiedRange}"></span>
            </mark>
        </p>
        <p th:if="${#fields.hasErrors('scheduleInputs.setOfUniqueMeetingDateTimes')}">
            <mark>
                <span name="scheduleInputsError" th:errors="*{scheduleInputs.setOfUniqueMeetingDateTimes}"></span>
            </mark>
        </p>
        <table id="schedules">
            <thead>
            <tr>
                <th></th>
                <th>開催日</th>
                <th colspan="3">開始時刻</th>
                <th>会議時間</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="schedule,scheduleStat: *{scheduleInputs.asList()}">
                <tr>
                    <td th:text="${scheduleStat.count}">1</td>
                    <td>
                        <input type="hidden" th:field="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleNumber.value}">
                        <input type="date" th:field="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.meetingDate.value}">
                        <p th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.meetingDateNotEmpty')}">
                            <mark><span
                                    th:id="scheduleInputs.list__${scheduleStat.index}__.scheduleConstruct.meetingDateNotEmpty"
                                    th:errors="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.meetingDateNotEmpty}"></span></mark>
                        </p>
                    </td>
                    <td>
                        <input type="number" th:field="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startHour.value}"  step="1"
                            th:min="${T(meeting.domain.model.schedule.construct.StartHour).MIN}"
                               th:max="${T(meeting.domain.model.schedule.construct.StartHour).MAX}">
                        <p th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startHourNotEmpty')}">
                            <mark><span
                                    th:id="scheduleInputs.list__${scheduleStat.index}__.scheduleConstruct.startHourNotEmpty"
                                    th:errors="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startHourNotEmpty}"></span></mark>
                        </p>
                        <p th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startHour.valid')}">
                            <mark><span
                                    th:id="scheduleInputs.list__${scheduleStat.index}__.scheduleConstruct.startHour.valid"
                                    th:errors="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startHour.valid}"></span></mark>
                        </p>
                    </td>
                    <td>:</td>
                    <td>
                        <select th:field="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startMinute.value}">
                            <option th:each="startMinuteOpt : ${meetingInputForm.startMinuteOptions.asList()}"
                                    th:value="${startMinuteOpt.value()}"
                                    th:text="${startMinuteOpt.label()}"></option>
                        </select>
                        <p th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startMinuteNotEmpty')}">
                            <mark><span
                                    th:id="scheduleInputs.list__${scheduleStat.index}__.scheduleConstruct.startMinuteNotEmpty"
                                    th:errors="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.startMinuteNotEmpty}"></span></mark>
                        </p>
                    </td>
                    <td>
                        <select th:field="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.duration.value}">
                            <option th:each="durationOpt : ${meetingInputForm.durationOptions.asList()}"
                                    th:value="${durationOpt.value()}"
                                    th:text="${durationOpt.label()}"></option>
                        </select>
                        <p th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.durationNotEmpty')}">
                            <mark><span
                                    th:id="scheduleInputs.list__${scheduleStat.index}__.scheduleConstruct.durationNotEmpty"
                                    th:errors="*{scheduleInputs.list[__${scheduleStat.index}__].scheduleConstruct.durationNotEmpty}"></span></mark>
                        </p>
                    </td>
                    <td>
                        <button th:if="${scheduleStat.index > 0}"
                                name="removeSchedule"
                                th:value="${scheduleStat.index}"
                                class="small-button">削除</button>
                    </td>
                </tr>
                <tr th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__]')}">
                    <td colspan="7" class="meeting__scheduleInputs-error">
                        <p th:if="${#fields.hasErrors('scheduleInputs.list[__${scheduleStat.index}__]')}">
                            <mark><span th:errors="*{scheduleInputs.list[__${scheduleStat.index}__]}"></span></mark>
                        </p>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>

    </th:block>

    <th:block th:fragment="show-location (meetingShowLocation)">
        <div class="meeting-show__location-parent">
            <input type="text" id="url" class="meeting-show__location" th:readonly="readonly" th:value="${meetingShowLocation}">
            <button id="copyUrlButton" class="small-button url-copy-button">URLをコピーする</button>
        </div>
        <p>ミーティングの編集・削除を行う場合は、上記URLへアクセスするか、「ミーティングの詳細」をクリックしてください。</p>
    </th:block>
</body>
</html>
