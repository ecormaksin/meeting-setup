<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティングの詳細</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>

<main>
  <article>
    <h1>ミーティングの詳細</h1>
    <form method="post" th:object="${meeting}" th:action="@{/attendance}">
      <label>件名</label>
      <p class="meeting-show-detail" th:text="${meeting.subject()}" />
      <label>ミーティングの補足説明</label>
      <p class="meeting-show-detail" th:text="${meeting.memo()}" />
      <label>日程候補</label>
      <table>
        <thead>
          <tr>
            <th></th>
            <th>日程</th>
            <th th:each="attendanceCategory : ${T(meeting.domain.model.participant.attendance.AttendanceCategory).values()}"
                th:value="${attendanceCategory}" th:text="${attendanceCategory.symbol()}"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="schedule,scheduleStat: *{schedules.asList()}">
            <td th:text="${scheduleStat.count}">1</td>
            <td th:text="${schedule.show()}">
            </td>
            <td th:each="attendanceCategory : ${T(meeting.domain.model.participant.attendance.AttendanceCategory).values()}"
                th:value="${attendanceCategory}" th:text="${attendanceCategory.symbol()}">
            </td>
          </tr>
        </tbody>
      </table>
    </form>
  </article>
</main>
<footer th:replace="_parts/footer :: default"></footer>
</body>
</html>
