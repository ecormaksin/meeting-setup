<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティングの詳細</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>

<main>
  <article>
    <table>
      <thead>
        <tr>
          <th>日程</th>
          <th th:each="attendanceCategory : ${T(meeting.domain.model.participant.attendance.AttendanceCategory).values()}"
            th:value="${attendanceCategory}" th:text="${attendanceCategory.symbol()}"></th>
        </tr>
      </thead>
    </table>
  </article>
</main>
<footer th:replace="_parts/footer :: default"></footer>
</body>
</html>
