<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティングの詳細</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>

<main>
  <article>
    <h1>ミーティングの詳細</h1>
    <form method="get" th:object="${meeting}" th:action="@{/meeting/__${meetingId}__/attendance/input}">
      <label>件名</label>
      <p class="meeting-show__detail" th:text="${meeting.subject()}" />
      <label>ミーティングの補足説明</label>
      <p class="meeting-show__detail" th:text="${meeting.memo()}" />
      <label>日程候補</label>
      <table class="meeting-show__detail" >
        <thead>
          <tr>
            <th></th>
            <th>日程</th>
            <th th:each="convenienceCategory : ${T(meeting.domain.model.attendance.convenience.ConvenienceCategory).values()}"
                th:text="${convenienceCategory.symbol()}"></th>
            <th th:each="attendance, attendanceStat: *{attendances.asList()}"
                th:text="${attendance.participantName.value()}"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="schedule,scheduleStat: *{schedules.asList()}">
            <td th:text="${scheduleStat.count}">1</td>
            <td th:text="${schedule.meetingDate().show() + ' ' + schedule.startTime().show() + ' ～ ' + schedule.endTime().show()}">
            </td>
            <td th:each="convenienceCategory : ${T(meeting.domain.model.attendance.convenience.ConvenienceCategory).values()}"
                th:text="${meeting.totalNumberOfParticipantAt(schedule.scheduleNumber(), convenienceCategory).show()}">
            </td>
            <td th:each="attendance, attendanceStat: *{attendances.asList()}"
                th:text="${meeting.convenienceCategoryOf(attendance.attendanceId(), schedule.scheduleNumber()).symbol()}"></td>
          </tr>
        </tbody>
      </table>

      <div>
        <button>出欠を入力する</button>
      </div>
    </form>
  </article>
</main>
<footer th:replace="_parts/footer :: default"></footer>
</body>
</html>
