<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティングの作成</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>
<header th:replace="_parts/navigation :: home_only"></header>

<main>
  <article>
    <h1>ミーティングの作成</h1>
    <form method="post" action="#" id="meetingCreateForm"
          th:object="${meetingInputForm}" th:action="@{/meeting/create}">

      <ul th:if="${#fields.hasGlobalErrors()}" class="notification is-danger">
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>

      <th:block th:replace="_parts/meeting :: form (meetingInputForm=${meetingInputForm})"></th:block>

      <div>
        <button type="button" id="createMeetingButton">作成</button>
      </div>
    </form>
  </article>
</main>
<footer th:replace="_parts/footer :: default"></footer>
<script th:inline="javascript">
$(function() {
  var organizerNumber = localStorage.getItem('organizerNumber');
  if (!organizerNumber) {
    localStorage.setItem('organizerNumber', [[${organizerNumber.value}]]);
  }

  $('#createMeetingButton').on('click', function() {
    const aFormData = new FormData( $('#meetingCreateForm')[0] );
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/meeting/create');
    xhr.setRequestHeader('organizerNumber', localStorage.getItem('organizerNumber'));
    xhr.send(aFormData);
  });
});
</script>
</body>
</html>
