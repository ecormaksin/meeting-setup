<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティングの編集</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>

<main>
  <article>
    <h1>ミーティングの編集</h1>
    <form method="post" action="#"
          th:object="${meetingEditRequest}" th:action="@{/meeting/__${meetingId}__/edit}">

      <ul th:if="${#fields.hasGlobalErrors()}" class="notification is-danger">
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>

      <input type="hidden" th:field="*{meetingId.value}" />

      <div th:replace="_parts/meeting_input :: subject_part (subject=*{subject})"></div>

      <div th:replace="_parts/meeting_input :: memo_part (memo=*{memo})"></div>

      <div th:replace="_parts/meeting_input :: schedules_part (schedules=*{schedules})"></div>

      <div th:replace="_parts/meeting_input :: organizerTerminal_part (organizerTerminal=*{organizerTerminal})"></div>

      <div>
        <button>編集</button>
      </div>
    </form>
  </article>

</main>
<footer th:replace="_parts/footer :: default"></footer>
</body>
</html>
