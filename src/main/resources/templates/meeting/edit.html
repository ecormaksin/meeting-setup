<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティングの作成</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>

<main>
  <article>
    <h1>ミーティングの編集</h1>
    <form method="post" action="#"
          th:object="${meetingEditRequest}" th:action="@{/meeting/__${meetingId}__/edit}">

      <ul th:if="${#fields.hasGlobalErrors()}" class="notification is-danger">
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>

      <input type="hidden" th:field="*{meetingId.value}" />

      <label>件名</label>
      <input type="text" th:field="*{subject.value}" placeholder="○○様カンファレンス など" class="meeting__subject">
      <p th:if="${#fields.hasErrors('subject.value')}">
        <mark><span th:errors="*{subject.value}"></span></mark>
      </p>

      <label>メモ（任意）</label>
      <textarea th:field="*{memo.value}" placeholder="リハビリ実施計画書について など" class="meeting__memo"></textarea>
      <p th:if="${#fields.hasErrors('memo.value')}">
        <mark><span th:errors="*{memo.value}"></span></mark>
      </p>

      <div class="meeting__schedules-title-section">
        <label class="meeting__schedules-title-label">日程候補</label>
        <button type="submit" name="addSchedule"
                class="small-button">追加</button>
      </div>
      <table>
        <thead>
          <tr>
            <th></th>
            <th></th>
            <th>開催日</th>
            <th>開始時刻</th>
            <th></th>
            <th>終了時刻</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
        <th:block th:each="schedule,scheduleStat: *{schedules.asList()}">
          <tr>
            <td th:text="${scheduleStat.count}">1</td>
            <td>
              <input type="hidden" th:field="*{schedules.list[__${scheduleStat.index}__].scheduleNumber.value}">
              <input type="date" th:field="*{schedules.list[__${scheduleStat.index}__].scheduleConstruct.meetingDate.value}">
              <p th:if="${#fields.hasErrors('schedules.list[__${scheduleStat.index}__].scheduleConstruct.meetingDate.value')}">
                <mark><span th:errors="*{schedules.list[__${scheduleStat.index}__].scheduleConstruct.meetingDate.value}"></span></mark>
              </p>
            </td>
            <td>
              <input type="time" th:field="*{schedules.list[__${scheduleStat.index}__].scheduleConstruct.startTime.value}">
              <p th:if="${#fields.hasErrors('schedules.list[__${scheduleStat.index}__].scheduleConstruct.startTime.value')}">
                <mark><span th:errors="*{schedules.list[__${scheduleStat.index}__].scheduleConstruct.startTime.value}"></span></mark>
              </p>
            </td>
            <td>～</td>
            <td>
              <input type="time" th:field="*{schedules.list[__${scheduleStat.index}__].scheduleConstruct.endTime.value}">
              <p th:if="${#fields.hasErrors('schedules.list[__${scheduleStat.index}__].scheduleConstruct.endTime.value')}">
                <mark><span th:errors="*{schedules.list[__${scheduleStat.index}__].scheduleConstruct.endTime.value}"></span></mark>
              </p>
            </td>
            <td>
              <button th:if="${scheduleStat.index > 0}"
                      type="submit" name="removeSchedule"
                      th:value="${scheduleStat.index}"
                      class="small-button">削除</button>
            </td>
          </tr>
          <tr th:if="${#fields.hasErrors('schedules.list[__${scheduleStat.index}__]') or #fields.hasErrors('schedules.list[__${scheduleStat.index}__].scheduleConstruct')}">
            <td colspan="6" class="meeting__schedules-error">
              <p th:if="${#fields.hasErrors('schedules.list[__${scheduleStat.index}__].scheduleConstruct')}">
                <mark><span th:errors="*{schedules.list[__${scheduleStat.index}__].scheduleConstruct}"></span></mark>
              </p>
              <p th:if="${#fields.hasErrors('schedules.list[__${scheduleStat.index}__]')}">
                <mark><span th:errors="*{schedules.list[__${scheduleStat.index}__]}"></span></mark>
              </p>
            </td>
          </tr>
        </th:block>
        </tbody>
      </table>
      <div>
        <p th:if="${#fields.hasErrors('schedules')}">
          <mark><span th:errors="*{schedules}"></span></mark>
        </p>
      </div>

      <input type="hidden" th:field="*{organizerTerminal.ipAddress.value}">
      <input type="hidden" th:field="*{organizerTerminal.osFamily.value}">
      <input type="hidden" th:field="*{organizerTerminal.userAgentFamily.value}">

      <div>
        <button>編集</button>
      </div>
    </form>
  </article>

</main>
<footer th:replace="_parts/footer :: default"></footer>
</body>
</html>
