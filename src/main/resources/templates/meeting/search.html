<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>作成したミーティングの検索</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>
<header th:replace="_parts/navigation :: home_only"></header>

<main>
  <article>
    <h1>作成したミーティングの検索</h1>

    <h2>検索条件</h2>
    <form method="get" action="#"
        th:object="${searchCondition}"  th:action="@{/meeting/search}">

      <ul th:if="${#fields.hasGlobalErrors()}" class="notification is-danger">
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>

      <label>キーワード（件名とメモに含まれるものを検索します。空白で全件を検索します。）</label>
      <input type="text" placeholder="キーワード" th:field="*{keyword.value}" class="meeting-search__keyword">

      <label>検索期間（日程候補の中で期間が含まれるものを検索します。）</label>
      <div class="meeting-search__search-period-parent">
        <input type="date" th:field="*{startDate.value}">
        <div>～</div>
        <input type="date" th:field="*{endDate.value}">
      </div>
      <p th:if="${#fields.hasErrors('startDate.value')}">
        <mark><span th:errors="*{startDate.value}"></span></mark>
      </p>
      <p th:if="${#fields.hasErrors('endDate.value')}">
        <mark><span th:errors="*{endDate.value}"></span></mark>
      </p>
      <p th:if="${#fields.hasErrors('durationValid')}">
        <mark><span th:errors="*{durationValid}"></span></mark>
      </p>

      <button type="button" id="searchMeetingButton" class="small-button" disabled="disabled">検索する</button>
      <button name="search" id="submitFormButtonWithSearch" class="button-hidden">隠し削除実行ボタン</button>
    </form>

    <h2>検索結果</h2>

    <p>
      検索結果が <span th:text="${searchCondition.limitCount.value}"></span> 件を超える場合は、
      条件に該当するミーティングのうち、登録順で先頭の結果が表示されます。
    </p>
    <p>該当するミーティングが見つからない場合は、条件を変更してください。</p>

    <table th:if="${meetingList.itemAvailability() == T(meeting.domain.model.meeting.meeting_list.MeetingListItemAvailability).HAVE_ITEMS}">
      <thead>
        <tr>
          <th></th>
          <th>件名</th>
          <th>日程</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="meetingListItem, meetingListItemStat : ${meetingList.asList()}">
          <td th:text="${meetingListItemStat.count}">1</td>
          <td>
            <a th:href="@{/meeting/__${meetingListItem.meetingNumber()}__/show}" th:text="${meetingListItem.subject().value()}"></a>
          </td>
          <td>
            <div th:each="schedule, scheduleStat : ${meetingListItem.schedules().asList()}">
              <span th:text="${schedule.meetingDate().show() + ' ' + schedule.startTime().show() + ' ～ ' + schedule.endTime().show()}"></span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <p th:if="${meetingList.itemAvailability() == T(meeting.domain.model.meeting.meeting_list.MeetingListItemAvailability).HAVE_NO_ITEMS}">
      条件に該当するミーティングが見つかりませんでした。
    </p>

  </article>
</main>
<footer th:replace="_parts/footer :: default"></footer>
<script th:inline="javascript">
$(function() {

  const organizerNumber = localStorage.getItem('organizerNumber');
  /*[# th:if="${organizerNumber != null}"]*/
  if (!organizerNumber) {
    localStorage.setItem('organizerNumber', [[${organizerNumber.value}]]);
  }
  /*[/]*/

  $('#searchMeetingButton').prop('disabled', false);

  $('#searchMeetingButton').on('click', function(event) {
    $(this).prop('disabled', true);

    document.cookie = "organizerNumber=; max-age=0";
    document.cookie = "organizerNumber=" + localStorage.getItem('organizerNumber');

    $('#submitFormButtonWithSearch').click();
  });
});
</script>
</body>
</html>
