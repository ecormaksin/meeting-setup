<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティングの編集</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>
<header th:replace="_parts/navigation :: home_meeting-show (meetingId=${meetingId})"></header>

<main>
  <article>
    <h1>ミーティングの編集</h1>
    <form method="post" action="#"
          th:object="${meetingEditRequest}" th:action="@{/meeting/__${meetingId}__/edit}">

      <ul th:if="${#fields.hasGlobalErrors()}" class="notification is-danger">
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>

      <th:block th:replace="_parts/meeting :: form (subject=*{subject}, memo=*{memo}, schedules=*{schedules}, organizerTerminal=*{organizerTerminal})"></th:block>

      <p>
        削除すると元に戻せません。
      </p>
      <div class="meeting-edit__button-parent">
        <div>
          <button>編集</button>
        </div>
        <div>
          <button name="delete" class="delete-button">削除</button>
        </div>
      </div>
    </form>
  </article>

</main>
<footer th:replace="_parts/footer :: default"></footer>
</body>
</html>
