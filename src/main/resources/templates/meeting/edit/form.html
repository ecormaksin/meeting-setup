<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティングの編集</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>
<header th:replace="_parts/navigation :: home_meeting-show (meetingNumber=${meetingNumber})"></header>

<main>
  <article>
    <h1>ミーティングの編集</h1>
    <form method="post" action="#"
          th:object="${meetingInputForm}" th:action="@{/meeting/__${meetingNumber}__/edit}">

      <ul th:if="${#fields.hasGlobalErrors()}" class="notification is-danger">
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>

      <th:block th:replace="_parts/meeting :: form (meetingInputForm=${meetingInputForm})"></th:block>

      <p>
        削除すると元に戻せません。
      </p>
      <div class="meeting-edit__button-parent">
        <div>
          <button type="button" id="editMeetingButton" disabled="disabled">編集</button>
        </div>
        <div>
          <button type="button" id="deleteMeetingButton" class="delete-button" disabled="disabled">削除</button>
          <button name="delete" id="submitFormButtonWithDelete" class="button-hidden">隠し削除実行ボタン</button>
        </div>
      </div>
    </form>
  </article>

</main>
<footer th:replace="_parts/footer :: default"></footer>
<script th:inline="javascript">
$(function() {

  function disableTransactionButtons(disabled) {
    $('#editMeetingButton').prop('disabled', disabled);
    $('#deleteMeetingButton').prop('disabled', disabled);
  }

  function setOrganizerNumber() {
    document.cookie = "organizerNumber=" + localStorage.getItem('organizerNumber');
  }

  function prepareSubmit() {
    disableTransactionButtons(true);
    setOrganizerNumber();
  }

  disableTransactionButtons(false);

  $('#editMeetingButton').on('click', function() {
    prepareSubmit();
    $('form').get(0).submit();
  });

  $('#deleteMeetingButton').on('click', function() {
    prepareSubmit();
    $('#submitFormButtonWithDelete').click();
  });
});
</script>
</body>
</html>
