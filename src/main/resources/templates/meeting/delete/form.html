<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティングの削除</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>
<header th:replace="_parts/navigation :: home_meeting-show (meetingId=${meetingId})"></header>

<main>
  <article>
    <h1>ミーティングの削除</h1>
    <form method="post" action="#"
          th:object="${meetingDeleteRequest}" th:action="@{/meeting/__${meetingId}__/delete}">
      <label>件名</label>
      <input type="text" th:field="*{subject.value}" class="meeting__subject" readonly="readonly">

      <label>ミーティングの補足説明</label>
      <textarea th:field="*{memo.value}" class="meeting__memo" readonly="readonly"></textarea>

      <label>日程候補</label>
      <table class="meeting-show__detail" >
        <thead>
        <tr>
          <th></th>
          <th>開催日</th>
          <th>開始時刻</th>
          <th></th>
          <th>終了時刻</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="schedule,scheduleStat: *{schedules.asList()}">
          <tr>
            <td th:text="${scheduleStat.count}">1</td>
            <td>
              <input type="hidden" th:field="*{schedules.list[__${scheduleStat.index}__].scheduleNumber.value}">
              <input type="date" th:field="*{schedules.list[__${scheduleStat.index}__].scheduleConstruct.meetingDate.value}" readonly="readonly">
            </td>
            <td>
              <input type="time" th:field="*{schedules.list[__${scheduleStat.index}__].scheduleConstruct.startTime.value}" readonly="readonly">
            </td>
            <td>～</td>
            <td>
              <input type="time" th:field="*{schedules.list[__${scheduleStat.index}__].scheduleConstruct.endTime.value}" readonly="readonly">
            </td>
          </tr>
        </th:block>
        </tbody>
      </table>

      <input type="hidden" th:field="*{organizerTerminal.ipAddress.value}">
      <input type="hidden" th:field="*{organizerTerminal.osFamily.value}">
      <input type="hidden" th:field="*{organizerTerminal.userAgentFamily.value}">

      <p>
        削除すると元に戻せません。
      </p>
      <div>
        <button class="delete-button">削除</button>
      </div>
    </form>
  </article>
</main>
<footer th:replace="_parts/footer :: default"></footer>
</body>
</html>
