<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティングの作成 完了</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>

<main>
  <article>
    <p>ミーティングの作成が完了しました。</p>
    <p>参加者には次のURLを連絡してください。: </p>
    <div class="meeting-show__location-parent">
      <input type="text" id="url" class="meeting-show__location" th:readonly="readonly" th:value="${meetingShowLocation}">
      <button id="copyUrlButton" class="small-button url-copy-button">URLをコピーする</button>
    </div>
  </article>
</main>
<footer th:replace="_parts/footer :: default"></footer>
<script>
$(function() {
  var copyUrlButtonObj = $('#copyUrlButton');

  function copyUrl() {
    var url = $('#url').val();
    var dummyTextBox = $("<input type='text'>");
    dummyTextBox.val(url);
    $('body').append(dummyTextBox);
    dummyTextBox.select();
    document.execCommand('copy');
    dummyTextBox.remove();

    copyUrlButtonObj.text('コピー完了');
    copyUrlButtonObj.addClass('url-copy-button-copied');
    setTimeout(removeCopiedStyle, 5000);
  }

  function removeCopiedStyle() {
    copyUrlButtonObj.text('URLをコピーする');
    copyUrlButtonObj.removeClass('url-copy-button-copied');
  }

  copyUrlButtonObj.on('click', copyUrl);
});
</script>
</body>
</html>
