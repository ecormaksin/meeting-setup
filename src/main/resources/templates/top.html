<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティング調整サービス</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>

<main>
  <article>
    <h1>ミーティング調整サービス メニュー</h1>
    <ul>
      <li><a th:href="@{/meeting/create}">ミーティングの作成</a></li>
      <th:block th:if="${organizerMeetingList.itemAvailability() == T(meeting.domain.model.meeting.OrganizerMeetingListItemAvailability).HAVE_ITEMS}">
      <li>ミーティングの編集
        <ul>
          <th:block th:each="meetingListItem: ${organizerMeetingList.asList()}">
          <li><a th:href="@{/meeting/__${meetingListItem.meetingId()}__/show}" th:text="${meetingListItem.subject().value()}"></a></li>
          </th:block>
        </ul>
      </li>
      </th:block>
    </ul>
  </article>
</main>
<footer th:replace="_parts/footer :: default"></footer>
</body>
</html>
