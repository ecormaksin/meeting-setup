<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" >
<head>
  <th:block th:replace="_parts/head :: meta"/>
  <title>ミーティング調整サービス</title>
  <th:block th:replace="_parts/head :: css"/>
</head>
<body>

<main>
  <article>
    <h1>ミーティング調整サービス メニュー</h1>
    <ul>
      <li><a th:href="@{/meeting/create}">ミーティングの作成</a></li>
      <li><a th:href="@{/meeting/search}">作成したミーティングの検索</a></li>
    </ul>
  </article>
</main>
<footer th:replace="_parts/footer :: default"></footer>
<script th:inline="javascript">
$(function() {

  const organizerNumber = localStorage.getItem('organizerNumber');
  /*[# th:if="${organizerNumber != null}"]*/
  if (!organizerNumber) {
    localStorage.setItem('organizerNumber', [[${organizerNumber.value}]]);
  }
  /*[/]*/

  const participantNumber = localStorage.getItem('participantNumber');
  /*[# th:if="${participantNumber != null}"]*/
  if (!participantNumber) {
    localStorage.setItem('participantNumber', [[${participantNumber.value}]]);
  }
  /*[/]*/
});
</script>
</body>
</html>
