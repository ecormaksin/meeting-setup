version: "3.9"
services:
  postgres:
    build:
      context: .
    environment:
      POSTGRES_PASSWORD: secret
      TZ: "Asia/Tokyo"
    ports:
      - 5432:5432
    volumes:
      - "./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d"
      - data:/var/lib/postgresql/data
      - work:/work

volumes:
  data:
  work:
